name: blink2video
version: "0.25.0"
slug: blink2video
description: Blink camera live view, arming and a local timestamped clip archive (wraps nico579/blink2video)
url: https://github.com/nico579/blink2video
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: blink2video web interface
webui: http://[HOST]:[PORT:8765]
map:
  - addon_config:rw
options:
  trusted_host: "192.168.1.0/24"
schema:
  trusted_host: str
